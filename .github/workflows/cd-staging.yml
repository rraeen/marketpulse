# ============================================
# MarketPulse - Continuous Deployment (Staging)
# ============================================
# Deploys to staging environment on merge to develop branch

name: CD - Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'

env:
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/marketpulse

jobs:
  # --------------------------------------------
  # Job 1: Build and Push Docker Image
  # --------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./marketpulse
          file: ./marketpulse/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=staging

  # --------------------------------------------
  # Job 2: Deploy to Staging
  # --------------------------------------------
  deploy:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.marketpulse.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"
          # Add your deployment commands here
          # Example: SSH to server and run docker-compose pull && docker-compose up -d
          
          # For demonstration:
          echo "Deployment command would execute here"
          echo "Using Docker Compose or Kubernetes manifests"

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          # Wait for deployment to be ready
          sleep 30
          
          # Basic health check
          # curl -f https://staging.marketpulse.com/api/health || exit 1
          echo "✅ Smoke tests passed"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Staging deployment successful"
          else
            echo "❌ Staging deployment failed"
          fi

  # --------------------------------------------
  # Job 3: Post-Deployment Tests
  # --------------------------------------------
  post-deployment-tests:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run health checks
        run: |
          echo "Checking application health..."
          # curl -f https://staging.marketpulse.com/api/health
          echo "✅ Health check passed"

      - name: Verify critical endpoints
        run: |
          echo "Verifying critical endpoints..."
          # Add endpoint verification commands
          echo "✅ All endpoints responding"
