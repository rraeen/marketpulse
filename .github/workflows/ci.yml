# ============================================
# MarketPulse - Continuous Integration Pipeline
# ============================================
# Runs on every push and pull request
# Purpose: Validate code quality, run tests, ensure builds succeed

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '20.x'

jobs:
  # --------------------------------------------
  # Job 1: Lint and Code Quality
  # --------------------------------------------
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: marketpulse/package-lock.json

      - name: Install dependencies
        working-directory: ./marketpulse
        run: npm ci

      - name: Run ESLint
        working-directory: ./marketpulse
        run: npm run lint
        continue-on-error: false

      - name: Check TypeScript
        working-directory: ./marketpulse
        run: npx tsc --noEmit

  # --------------------------------------------
  # Job 2: Unit Tests
  # --------------------------------------------
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: marketpulse/package-lock.json

      - name: Install dependencies
        working-directory: ./marketpulse
        run: npm ci

      - name: Run unit tests
        working-directory: ./marketpulse
        run: npm run test -- --coverage --maxWorkers=2
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/marketpulse-test
          TEST_JWT_SECRET: test-secret-key

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./marketpulse/coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  # --------------------------------------------
  # Job 3: E2E Tests
  # --------------------------------------------
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: marketpulse/package-lock.json

      - name: Install dependencies
        working-directory: ./marketpulse
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./marketpulse
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./marketpulse
        run: npm run test:e2e
        env:
          MONGODB_URI: mongodb://localhost:27017/marketpulse-test
          JWT_SECRET: test-secret-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: marketpulse/playwright-report/
          retention-days: 7

  # --------------------------------------------
  # Job 4: Build Verification
  # --------------------------------------------
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: marketpulse/package-lock.json

      - name: Install dependencies
        working-directory: ./marketpulse
        run: npm ci

      - name: Build application
        working-directory: ./marketpulse
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/marketpulse
          JWT_SECRET: build-time-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          BUILD_STANDALONE: true

      - name: Check build output
        working-directory: ./marketpulse
        run: |
          if [ ! -d ".next" ]; then
            echo "Build failed: .next directory not found"
            exit 1
          fi
          echo "✅ Build successful"

  # --------------------------------------------
  # Job 5: Docker Build Test
  # --------------------------------------------
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./marketpulse
          file: ./marketpulse/Dockerfile
          push: false
          tags: marketpulse:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------
  # Job 6: Security Scan
  # --------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        working-directory: ./marketpulse
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './marketpulse'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

  # --------------------------------------------
  # Summary
  # --------------------------------------------
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-e2e, build, docker-build]
    if: success()
    
    steps:
      - name: Success notification
        run: |
          echo "✅ All CI checks passed successfully!"
          echo "Pipeline completed at: $(date)"
