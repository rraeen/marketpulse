# ============================================
# MarketPulse - Production Docker Compose
# ============================================
# Production-ready configuration
# 
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
# ============================================

version: '3.9'

services:
  # --------------------------------------------
  # MongoDB Database (Production)
  # --------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: marketpulse-mongodb-prod
    restart: always
    ports:
      - "127.0.0.1:27017:27017"  # Bind to localhost only
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: marketpulse
    volumes:
      - mongodb_prod_data:/data/db
      - mongodb_prod_config:/data/configdb
      - ./backups:/backups:rw
    networks:
      - marketpulse-prod-network
    command: ["mongod", "--auth", "--bind_ip_all"]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --username ${MONGODB_ROOT_USER} --password ${MONGODB_ROOT_PASSWORD} --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------
  # Next.js Application (Production)
  # --------------------------------------------
  app:
    build:
      context: ./marketpulse
      dockerfile: Dockerfile
      target: runner
      args:
        - NODE_ENV=production
    container_name: marketpulse-app-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      ENABLE_EMAIL_NOTIFICATIONS: true
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - marketpulse-prod-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# --------------------------------------------
# Networks
# --------------------------------------------
networks:
  marketpulse-prod-network:
    driver: bridge
    name: marketpulse-prod-network

# --------------------------------------------
# Volumes
# --------------------------------------------
volumes:
  mongodb_prod_data:
    name: marketpulse-mongodb-prod-data
  mongodb_prod_config:
    name: marketpulse-mongodb-prod-config
