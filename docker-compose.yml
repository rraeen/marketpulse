# ============================================
# MarketPulse - Docker Compose Configuration
# ============================================
# Local development environment setup
# 
# Usage:
#   Start:    docker-compose up -d
#   Stop:     docker-compose down
#   Rebuild:  docker-compose up -d --build
#   Logs:     docker-compose logs -f
# ============================================

version: '3.9'

services:
  # --------------------------------------------
  # MongoDB Database
  # --------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: marketpulse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: marketpulse
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - marketpulse-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------------------------------------------
  # Next.js Application (Development)
  # --------------------------------------------
  app:
    build:
      context: ./marketpulse
      dockerfile: Dockerfile
      target: runner
    container_name: marketpulse-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/marketpulse?authSource=admin
      JWT_SECRET: dev-secret-key-change-in-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM:-"MarketPulse <no-reply@marketpulse.com>"}
      ENABLE_EMAIL_NOTIFICATIONS: ${ENABLE_EMAIL_NOTIFICATIONS:-false}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      # Mount source code for hot reload (development only)
      # Remove this in production
      - ./marketpulse:/app:delegated
      - /app/node_modules
      - /app/.next
    networks:
      - marketpulse-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --------------------------------------------
  # MongoDB Express (Database Admin UI)
  # Optional - Remove in production
  # --------------------------------------------
  mongo-express:
    image: mongo-express:latest
    container_name: marketpulse-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - marketpulse-network
    profiles:
      - debug

# --------------------------------------------
# Networks
# --------------------------------------------
networks:
  marketpulse-network:
    driver: bridge
    name: marketpulse-network

# --------------------------------------------
# Volumes
# --------------------------------------------
volumes:
  mongodb_data:
    name: marketpulse-mongodb-data
  mongodb_config:
    name: marketpulse-mongodb-config
